course:

  # Identity
  title: "Training title"
  subtitle: "Short subtitle describing the training"
  description: >
    Provide a short description of the training, including its main
    topic, purpose, or focus.

  credits:
    value: x
    unit: "hp"
    note: "Provide the number of credits awarded (in ECTS or hp), if applicable.
      Indicate whether formal approval is determined by the participant's host university."

  # Delivery
  # Replace these placeholder dates with the actual training dates.
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  duration: "Number of days"
  mode: "Online / In-person / Hybrid"

  instruction:
    - "Describe the main teaching format or activity, e.g. Self-study"
    - "Add another teaching format or activity, e.g. Online lectures"
    - "Add another teaching format or activity, e.g. In-person workshop"
    
  location: "Venue name or online"
  language: "Language the training is provided in"

  # Educational
  target_audience: "Describe the intended participant group"
  expertise_level: "Beginner / Intermediate / Advanced"

  prerequisites:
    knowledge:
      - "Describe a required knowledge prerequisite"
      - "Add another knowledge prerequisite"
    technical:
      - "Describe a required technical prerequisite"
      - "Add another technical prerequisite"

  learning_outcomes:
    - "Add a learning outcome"
    - "Add another learning outcome"
    - "Add another learning outcome"

  keywords:
    - "Keyword 1"
    - "Keyword 2"
    - "Keyword 3"

  examination:
    description: >
      Describe how participants will be assessed, if applicable.
      Remove or leave this field empty if the training does not
      include an examination or other assessment.

  # Administration
  organizers:
    - "Organizer name"
    - "Add another organizer"

  content_providers:
    - "Content provider name"
    - "Add another content provider"

  # Contact
  contact:
    email: "training@example.org"

  reuse:

    licence: "CC BY 4.0"
    licence_url: "https://creativecommons.org/licenses/by/4.0/"
    doi: "DOI, if applicable"

