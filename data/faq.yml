faq:

  - question: "Will I receive a certificate for completing the course?"
    answer: >
      Upon satisfactory completion of the course, participants will
      receive a course completion certificate.

  - question: "I need to leave earlier. Is that acceptable?"
    answer: >
      Please contact the training organisers if you need to leave
      before the end of the course.

  - question: "What should I do if I become sick during the course?"
    answer: >
      Please inform the training organisers as soon as possible.

  - question: "Do you accommodate special dietary needs?"
    answer: >
      Yes. Please provide information about dietary requirements when
      registering.

  - question: "What should I do if I experience discrimination or harassment?"
    answer: >
      Please contact the training organisers or follow the relevant
      SciLifeLab procedures.